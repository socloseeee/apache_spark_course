<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img"><title>Повтор доставки ≠ новое событие</title><rect width="1400" height="800" fill="#F6F8FC"/><text x="65" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#087F8C">SPARK  /  РАЗБИРАЕМ МЕХАНИКУ</text><text x="65" y="133" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#152C48">Повтор доставки ≠ новое событие</text><text x="65" y="177" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52647A">Ноутбук 00 • Идентификатор события сохраняет свой смысл при повторном запуске.</text><rect x="65" y="240" width="380" height="235" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Исходный batch</text><text x="87" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">demo-001:17</text><text x="87" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">amount = "125.50"</text><text x="87" y="403" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">account_id = 42</text><text x="87" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">ts = фиксированное время</text><rect x="510" y="240" width="380" height="235" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="532" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Replay</text><text x="532" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">demo-001:17</text><text x="532" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Тот же payload</text><text x="532" y="403" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="532" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Новая доставка в Kafka</text><rect x="955" y="240" width="380" height="235" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="977" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Silver</text><text x="977" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Одно событие</text><text x="977" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">на demo-001:17</text><text x="977" y="403" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="977" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Точные повторы удалены</text><path d="M455,350 L497,350" stroke="#315BC6" stroke-width="4"/><path d="M497,350 l-13,-8 v16 z" fill="#315BC6"/><path d="M900,350 L942,350" stroke="#315BC6" stroke-width="4"/><path d="M942,350 l-13,-8 v16 z" fill="#315BC6"/><rect x="65" y="525" width="610" height="142" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="572" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#315BC6">Новый batch</text><text x="87" y="618" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">demo-002:17 — другой ID, новое событие</text><rect x="710" y="525" width="625" height="142" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="732" y="572" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#B64048">Конфликт источника</text><text x="732" y="618" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Тот же ID + другой payload → ошибка</text><text x="65" y="748" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087F8C">Проверь себя: что вырастет после replay — сообщения bronze или уникальные события?</text></svg>