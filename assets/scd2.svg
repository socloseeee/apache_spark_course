<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img"><title>SCD2: город определяется временем факта</title><rect width="1400" height="800" fill="#F6F8FC"/><text x="65" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#087F8C">SPARK  /  РАЗБИРАЕМ МЕХАНИКУ</text><text x="65" y="133" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#152C48">SCD2: город определяется временем факта</text><text x="65" y="177" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52647A">Ноутбуки 03–04 • Интервал [valid_from, valid_to): начало включено, конец исключён.</text><rect x="65" y="240" width="560" height="175" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Версия 1: Москва</text><text x="87" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">01 января 00:00 → 31 января 12:00</text><text x="87" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">is_current = false</text><rect x="670" y="240" width="665" height="175" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="692" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Версия 2: Сочи</text><text x="692" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">31 января 12:00 → открытый интервал</text><text x="692" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">valid_to = NULL; is_current = true</text><path d="M630,328 L658,328" stroke="#315BC6" stroke-width="4"/><path d="M658,328 l-13,-8 v16 z" fill="#315BC6"/><rect x="65" y="470" width="560" height="142" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="517" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#315BC6">Покупка в 11:59</text><text x="87" y="563" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Присоединяем Москву</text><rect x="670" y="470" width="665" height="142" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="692" y="517" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#315BC6">Покупка ровно в 12:00</text><text x="692" y="563" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Присоединяем Сочи — ровно одну версию</text><text x="65" y="675" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#152C48">Один MERGE закрывает прежнюю версию и вставляет новую в одном коммите.</text><text x="65" y="748" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087F8C">Проверь себя: почему условие ts &lt;= valid_to удвоит факт на границе?</text></svg>