<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img"><title>Выражение ещё не результат</title><rect width="1400" height="800" fill="#F6F8FC"/><text x="65" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#087F8C">SPARK  /  РАЗБИРАЕМ МЕХАНИКУ</text><text x="65" y="133" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#152C48">Выражение ещё не результат</text><text x="65" y="177" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52647A">Уроки 3.2 и 2.2 • Column описывает вычисление; action запрашивает результат.</text><rect x="65" y="245" width="380" height="230" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="292" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">1. Описываем</text><text x="87" y="338" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">F.col("amount") &gt; 100</text><text x="87" y="373" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="87" y="408" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Объект Column:</text><text x="87" y="443" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">условие, а не список чисел</text><rect x="510" y="245" width="380" height="230" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="532" y="292" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">2. Строим план</text><text x="532" y="338" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">df.filter(условие)</text><text x="532" y="373" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="532" y="408" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Новый DataFrame:</text><text x="532" y="443" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">цепочка преобразований</text><rect x="955" y="245" width="380" height="230" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="977" y="292" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">3. Вычисляем</text><text x="977" y="338" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">filtered.count()</text><text x="977" y="373" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="977" y="408" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Spark выполняет план</text><text x="977" y="443" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">и возвращает число</text><path d="M455,355 L497,355" stroke="#315BC6" stroke-width="4"/><path d="M497,355 l-13,-8 v16 z" fill="#315BC6"/><path d="M900,355 L942,355" stroke="#315BC6" stroke-width="4"/><path d="M942,355 l-13,-8 v16 z" fill="#315BC6"/><rect x="65" y="525" width="1270" height="143" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="572" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#315BC6">Нюанс</text><text x="87" y="618" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Определение схемы CSV и работа с метаданными могут выполняться раньше action.</text><text x="65" y="748" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087F8C">Проверь себя: какого типа результат каждого из трёх выражений?</text></svg>