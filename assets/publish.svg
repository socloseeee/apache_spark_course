<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img"><title>Публикация витрины без удаления рабочей</title><rect width="1400" height="800" fill="#F6F8FC"/><text x="65" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#087F8C">SPARK  /  РАЗБИРАЕМ МЕХАНИКУ</text><text x="65" y="133" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#152C48">Публикация витрины без удаления рабочей</text><text x="65" y="177" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52647A">Ноутбук 05 • В лабораторной один writer и Atomic database в ClickHouse.</text><rect x="65" y="245" width="380" height="225" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="292" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">1. Загрузка</text><text x="87" y="338" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Создать staging</text><text x="87" y="373" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">из обычного Parquet</text><text x="87" y="408" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="87" y="443" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Рабочая таблица доступна</text><rect x="510" y="245" width="380" height="225" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="532" y="292" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">2. Проверка</text><text x="532" y="338" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Число строк</text><text x="532" y="373" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Ключи без NULL</text><text x="532" y="408" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="532" y="443" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Ошибка → не переключать</text><rect x="955" y="245" width="380" height="225" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="977" y="292" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">3. Переключение</text><text x="977" y="338" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">EXCHANGE TABLES</text><text x="977" y="373" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="977" y="408" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Новый результат доступен</text><text x="977" y="443" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Старый остаётся в staging</text><path d="M455,353 L497,353" stroke="#315BC6" stroke-width="4"/><path d="M497,353 l-13,-8 v16 z" fill="#315BC6"/><path d="M900,353 L942,353" stroke="#315BC6" stroke-width="4"/><path d="M942,353 l-13,-8 v16 z" fill="#315BC6"/><rect x="65" y="525" width="1270" height="143" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="572" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#315BC6">Первая публикация</text><text x="87" y="618" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Если рабочей таблицы ещё нет, используем RENAME после проверки staging.</text><text x="65" y="748" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087F8C">Проверь себя: почему DROP рабочей таблицы перед загрузкой создаёт риск?</text></svg>