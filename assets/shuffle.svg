<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img"><title>Почему groupBy может потребовать shuffle</title><rect width="1400" height="800" fill="#F6F8FC"/><text x="65" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#087F8C">SPARK  /  РАЗБИРАЕМ МЕХАНИКУ</text><text x="65" y="133" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#152C48">Почему groupBy может потребовать shuffle</text><text x="65" y="177" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52647A">Модуль 8 • Пример группировки по городу; частичная агрегация уменьшает обмен.</text><rect x="65" y="240" width="430" height="165" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Исходная партиция 1</text><text x="87" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Москва: 10   •   Казань: 20</text><text x="87" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Москва: 5</text><rect x="65" y="445" width="430" height="165" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="492" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Исходная партиция 2</text><text x="87" y="538" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Казань: 7   •   Москва: 3</text><rect x="850" y="240" width="485" height="165" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="872" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#315BC6">Группа Москва</text><text x="872" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">10 + 5 + 3 = 18</text><rect x="850" y="445" width="485" height="165" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="872" y="492" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#315BC6">Группа Казань</text><text x="872" y="538" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">20 + 7 = 27</text><path d="M510,330 L835,330" stroke="#315BC6" stroke-width="4"/><path d="M835,330 l-13,-8 v16 z" fill="#315BC6"/><path d="M510,535 L835,535" stroke="#315BC6" stroke-width="4"/><path d="M835,535 l-13,-8 v16 z" fill="#315BC6"/><path d="M510,365 L835,485" stroke="#315BC6" stroke-width="4"/><path d="M835,485 l-13,-8 v16 z" fill="#315BC6"/><path d="M510,490 L835,365" stroke="#315BC6" stroke-width="4"/><path d="M835,365 l-13,-8 v16 z" fill="#315BC6"/><text x="560" y="647" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#52647A">Данные одного ключа собираются вместе</text><text x="65" y="748" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087F8C">Проверь себя: что произойдёт, если почти все строки принадлежат одному городу?</text></svg>