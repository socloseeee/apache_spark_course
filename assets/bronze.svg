<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img"><title>Bronze сохраняет возможность переиграть</title><rect width="1400" height="800" fill="#F6F8FC"/><text x="65" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#087F8C">SPARK  /  РАЗБИРАЕМ МЕХАНИКУ</text><text x="65" y="133" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#152C48">Bronze сохраняет возможность переиграть</text><text x="65" y="177" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52647A">Ноутбук 01 • Исправили парсер — повторно обработали сохранённый оригинал.</text><rect x="65" y="240" width="375" height="270" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Источник</text><text x="87" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">CSV + manifest</text><text x="87" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="87" y="403" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Kafka: key, value, topic,</text><text x="87" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">partition, offset, timestamp</text><rect x="505" y="240" width="395" height="270" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="527" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Bronze</text><text x="527" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Исходные файлы по batch</text><text x="527" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A"></text><text x="527" y="403" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Исходные bytes сообщений</text><text x="527" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">и метаданные Kafka</text><rect x="965" y="240" width="370" height="270" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="987" y="287" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087F8C">Silver</text><text x="987" y="333" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Парсинг и типы</text><text x="987" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Проверки качества</text><text x="987" y="403" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Точные повторы</text><text x="987" y="438" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Quarantine с причиной</text><path d="M450,350 L493,350" stroke="#315BC6" stroke-width="4"/><path d="M493,350 l-13,-8 v16 z" fill="#315BC6"/><path d="M910,350 L953,350" stroke="#315BC6" stroke-width="4"/><path d="M953,350 l-13,-8 v16 z" fill="#315BC6"/><rect x="65" y="553" width="1270" height="118" rx="16" fill="white" stroke="#D5DEEA" stroke-width="2"/><text x="87" y="600" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#315BC6">Что нельзя терять</text><text x="87" y="646" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52647A">Неизвестные поля и ошибочный JSON нужны для диагностики и повторного парсинга.</text><text x="65" y="748" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087F8C">Проверь себя: сможешь восстановить новое поле, если сохранил только parsed-колонки?</text></svg>